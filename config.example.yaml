# UUAgent 配置文件（YAML 是默认/推荐格式）
#
# 配置合并顺序（后者覆盖前者）：
# 1. 内置 defaults
# 2. 用户配置：~/.uuagent/config.yaml
# 3. 当前目录：./config.yaml
# 4. 项目配置：<workspace>/.uuagent/project.yaml（后续项目打开时加载）
# 5. 显式配置：UUAGENT_CONFIG 指向的 yaml
# 6. 环境变量：UUAGENT_PROXY_URL / UUAGENT_MODEL / UUAGENT_API_KEY
#
# 注意：API key/secrets 建议放环境变量，不写入项目配置、不提交仓库。

# ============================================
# 服务配置
# ============================================
port: 18463

# ============================================
# UUAgent 全局默认行为
# ============================================
agent:
  # OpenAI-compatible base URL，最终请求为：{proxy-url}/chat/completions
  # 例如 OpenAI 官方通常是 https://api.openai.com/v1
  proxy-url: "http://localhost:18463/v1"

  routing:
    tiers:
      fast: ["gpt-4o-mini", "gemini-2.5-flash", "deepseek-chat", "qwen2.5:7b"]
      strong: ["claude-sonnet-4", "gpt-4o", "deepseek-coder"]
      large_ctx: ["gemini-2.5-pro", "claude-sonnet-4"]
    rules:
      - name: simple_qa
        patterns: ["什么意思", "解释", "what is", "explain", "是什么", "怎么看"]
        tier: fast
      - name: code_edit
        patterns: ["修改", "重构", "实现", "fix", "implement", "refactor", "编辑"]
        tier: strong
      - name: long_context
        condition: "tokens > 50000"
        tier: large_ctx
    fallback: strong

  memory:
    auto_draft: true
    max_entries: 100
    max_chars_per_entry: 2000

  context:
    max_tokens: 32000
    compress_threshold: 0.8
    keep_last_messages: 12
    auto_compress: true

  subagent:
    max_concurrent: 3
    max_turns: 20
    blocked_tools: ["delegate", "memory"]

  max_turns: 50
  default_permission: "workspace-write" # read-only / workspace-write / danger-full-access

  ui:
    theme: dark

# ============================================
# Web 可配置 Agent Profiles
# 用户级建议放 ~/.uuagent/config.yaml；项目级建议放 <workspace>/.uuagent/project.yaml
# ============================================
agents:
  - id: default
    name: Default Agent
    description: General-purpose coding assistant
    system_prompt: ""
    model: ""                 # 空则走 routing
    enabled_tools: ["read", "write", "grep", "list_dir"]
    enabled_skills: ["mock-planner"]
    enabled_mcp_servers: ["mock"]
    permission_mode: "workspace-write"
    max_turns: 50

# ============================================
# Skills 配置
# 用户自定义 skill 建议放 ~/.uuagent/skills/<name>/SKILL.md
# 项目自定义 skill 建议放 <workspace>/.uuagent/skills/<name>/SKILL.md
# ============================================
skills:
  - name: mock-planner
    description: Built-in simulated planning skill
    path: ""                  # 可指向 SKILL.md；为空则使用 prompt
    prompt: "First state a short plan, then execute concisely."
    enabled: true
    scope: global

# ============================================
# MCP Servers 配置
# 用户级建议放 ~/.uuagent/config.yaml；项目级建议放 <workspace>/.uuagent/project.yaml
# secrets/env 不建议写入项目文件，优先从系统环境变量读取。
# ============================================
mcp_servers:
  - id: mock
    name: Mock MCP
    command: ""
    args: []
    env: {}
    transport: mock          # mock / stdio / sse / http
    enabled: true
    scope: global
