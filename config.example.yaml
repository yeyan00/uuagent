# UUAgent 配置文件

# ============================================
# CLIProxyAPI 配置 (模型代理 + 管理面板)
# ============================================
port: 8765

remote-management:
  allow-remote: false
  secret-key: "uuagent-admin"
  disable-control-panel: false

api-keys:
  - "uuagent-local"

# Gemini API Key
# gemini-api-key:
#   - api-key: "AIzaSy..."

# Claude API Key
# claude-api-key:
#   - api-key: "sk-ant-..."

# OpenAI API Key
# openai-api-key:
#   - api-key: "sk-..."

# 本地 Ollama
# ollama:
#   base-url: "http://127.0.0.1:11434"

routing:
  strategy: "round-robin"

# ============================================
# UUAgent 配置 (智能路由 + Agent 行为)
# ============================================
agent:
  # LLM 代理地址 (指向自己嵌入的 CLIProxyAPI)
  proxy-url: "http://localhost:8765"

  # 智能路由 — 按任务复杂度自动选模型
  routing:
    tiers:
      fast: ["gpt-4o-mini", "gemini-2.5-flash", "deepseek-chat", "qwen2.5:7b"]
      strong: ["claude-sonnet-4", "gpt-4o", "deepseek-coder"]
      large_ctx: ["gemini-2.5-pro", "claude-sonnet-4"]

    rules:
      - name: simple_qa
        patterns: ["什么意思", "解释", "what is", "explain", "是什么", "怎么看"]
        tier: fast

      - name: code_edit
        patterns: ["修改", "重构", "实现", "fix", "implement", "refactor", "编辑"]
        tier: strong

      - name: long_context
        condition: "tokens > 50000"
        tier: large_ctx

    # 规则匹配不到时的默认 tier
    fallback: strong

  # Memory 配置
  memory:
    auto_draft: true       # AI 写的 memory 标记为 draft
    max_entries: 100       # 每个 project 最大 memory 条目
    max_chars_per_entry: 2000

  # Subagent 配置
  subagent:
    max_concurrent: 3      # 最大并行子任务
    max_turns: 20          # 子任务最大轮数
    blocked_tools: ["delegate", "memory"]  # 子任务禁用的工具

  # Agent 行为
  max_turns: 50            # 主循环最大轮数
  default_permission: "workspace-write"  # read-only / workspace-write / danger-full-access

  # UI
  ui:
    theme: dark
