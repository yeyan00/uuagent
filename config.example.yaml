# UUAgent configuration file. YAML is the default and recommended format.
#
# Configuration merge order, with later layers overriding earlier ones:
# 1. Built-in defaults
# 2. User config: ~/.uuagent/config.yaml
# 3. Current directory: ./config.yaml
# 4. Project config: <workspace>/.uuagent/project.yaml
# 5. Explicit config: UUAGENT_CONFIG points to a yaml file
# 6. Environment variables: UUAGENT_PROXY_URL / UUAGENT_MODEL / UUAGENT_API_KEY
#
# Keep API keys and secrets in environment variables. Do not commit secrets.

# Service configuration.
port: 18463

# Global default UUAgent behavior.
agent:
  # OpenAI-compatible base URL. Requests are sent to {proxy-url}/chat/completions.
  # For official OpenAI, this is usually https://api.openai.com/v1.
  proxy-url: "http://localhost:18463/v1"

  routing:
    tiers:
      fast: ["gpt-4o-mini", "gemini-2.5-flash", "deepseek-chat", "qwen2.5:7b"]
      strong: ["claude-sonnet-4", "gpt-4o", "deepseek-coder"]
      large_ctx: ["gemini-2.5-pro", "claude-sonnet-4"]
    rules:
      - name: simple_qa
        patterns: ["what is", "explain"]
        tier: fast
      - name: code_edit
        patterns: ["fix", "implement", "refactor"]
        tier: strong
      - name: long_context
        condition: "tokens > 50000"
        tier: large_ctx
    fallback: strong

  memory:
    auto_draft: true
    max_entries: 100
    max_chars_per_entry: 2000

  context:
    max_tokens: 32000
    compress_threshold: 0.8
    keep_last_messages: 12
    auto_compress: true

  subagent:
    max_concurrent: 3
    max_turns: 20
    blocked_tools: ["delegate", "memory"]

  max_turns: 50
  default_permission: "workspace-write" # read-only / workspace-write / danger-full-access

  ui:
    theme: light

# Web-configurable Agent Profiles.
# User-level profiles belong in ~/.uuagent/config.yaml.
# Project-level profiles belong in <workspace>/.uuagent/project.yaml.
agents:
  - id: default
    name: Default Agent
    description: General-purpose coding assistant
    system_prompt: ""
    model: ""                 # Empty means automatic routing.
    enabled_tools: ["read", "write", "grep", "list_dir"]
    enabled_skills: ["mock-planner"]
    enabled_mcp_servers: ["mock"]
    permission_mode: "workspace-write"
    max_turns: 50

# Skills configuration.
# User skills: ~/.uuagent/skills/<name>/SKILL.md
# Project skills: <workspace>/.uuagent/skills/<name>/SKILL.md
skills:
  - name: mock-planner
    description: Built-in simulated planning skill
    path: ""                  # Can point to SKILL.md. Empty means use prompt.
    prompt: "First state a short plan, then execute concisely."
    enabled: true
    scope: global

# MCP server configuration.
# Prefer environment variables for secrets used by MCP servers.
mcp_servers:
  - id: mock
    name: Mock MCP
    command: ""
    args: []
    env: {}
    transport: mock          # mock / stdio / sse / http
    enabled: true
    scope: global
